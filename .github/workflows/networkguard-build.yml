name: NetworkGuard Android build
on:
  push:
    branches: [networkguard-app]
    paths:
      - "networkguard/**"
      - ".github/workflows/networkguard-build.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.10.2"
      - name: Android unit tests
        run: gradle -p networkguard :app:testDebugUnitTest --no-daemon --stacktrace
      - name: Build debug APK
        run: gradle -p networkguard :app:assembleDebug --no-daemon --stacktrace
      - name: Verify APK exists
        run: test -s networkguard/app/build/outputs/apk/debug/app-debug.apk
      - uses: actions/upload-artifact@v4
        with:
          name: NetworkGuard-0.2.0-debug
          path: networkguard/app/build/outputs/apk/debug/app-debug.apk
      - name: Publish separately from existing projects
        run: |
          cp networkguard/app/build/outputs/apk/debug/app-debug.apk NetworkGuard-0.2.0-debug.apk
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git config user.name "github-actions[bot]"
          git add NetworkGuard-0.2.0-debug.apk
          git diff --cached --quiet && exit 0
          git commit -m "Publish NetworkGuard 0.1 debug APK"
          git push origin HEAD:networkguard-app
